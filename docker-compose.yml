services:
  # ============================================================
  # PostgreSQL 16 + pgvector — 关系数据 + 向量存储
  # ============================================================
  postgres:
    image: codeaware/pgvector-pgsearch:pg16-v0.12.0
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.bm25
    command: postgres -c shared_preload_libraries=pg_search
    container_name: ${CODEAWARE_POSTGRES_CONTAINER_NAME:-ai-center-postgres}
    restart: unless-stopped
    ports:
      - "${CODEAWARE_PG_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ai_center
      POSTGRES_USER: aicenter
      POSTGRES_PASSWORD: aicenter123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./java-legacy/ai-center-server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-java-schema.sql:ro
      - ./docker/postgres/init/02-create-python-db.sql:/docker-entrypoint-initdb.d/02-create-python-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicenter -d ai_center"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # pgweb — PostgreSQL Web UI（开发期数据浏览，非必需，按需启动）
  # ============================================================
  pgweb:
    image: sosedoff/pgweb
    container_name: ${CODEAWARE_PGWEB_CONTAINER_NAME:-ai-center-pgweb}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CODEAWARE_PGWEB_PORT:-8081}:8081"
    environment:
      # Python 重构版用 ai_center_py（ai_center 是 Java legacy schema，勿连）
      PGWEB_DATABASE_URL: postgres://aicenter:aicenter123@postgres:5432/ai_center_py?sslmode=disable


  # ============================================================
  # Redis 7 — 缓存 + 短期记忆
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ${CODEAWARE_REDIS_CONTAINER_NAME:-ai-center-redis}
    restart: unless-stopped
    ports:
      - "${CODEAWARE_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Celery Worker — 异步任务队列
  # ============================================================
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ${CODEAWARE_CELERY_WORKER_CONTAINER_NAME:-ai-center-celery-worker}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_HOST: postgres
      PG_PORT: 5432
      LLM_API_KEY: ${LLM_API_KEY}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./codeaware-py:/app
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${CODEAWARE_FLOWER_HOST_PORT:-5555}:5555"


  # ============================================================
  # Kafka — 事件流（Kraft 模式，单节点）
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ${CODEAWARE_KAFKA_CONTAINER_NAME:-ai-center-kafka}
    ports:
      - "${CODEAWARE_KAFKA_HOST_PORT:-9093}:9093"
    environment:
      CLUSTER_ID: "mrjqpQhJQAyyYvuoOZprGA"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9091"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # Kafka Consumer — 事件消费者
  # ============================================================
  kafka_consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ${CODEAWARE_KAFKA_CONSUMER_CONTAINER_NAME:-ai-center-kafka-consumer}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./codeaware-py:/app
    working_dir: /app
    command: python -m app.ai.events.consumer
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata: