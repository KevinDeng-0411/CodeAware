[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeaware"
version = "0.1.0"
description = "CodeAware - AI 驱动的研发效能平台 (Java -> Python 重构)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "redis>=5.0",
    "unstructured[docx]>=0.16",
    "pypdf>=6.6.2",
    "pdfminer-six>=20251230,<20270000",
    "python-multipart>=0.0.20",
    "markdown>=3.5",
    "pathspec>=0.12,<1",
    "langchain-deepseek>=1.1.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "jieba>=0.42",
    "langgraph>=0.2",
    "celery>=5.4",
    "kafka-python>=2.0",
    "onnxruntime>=1.28.0",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    "flower>=2.0",  # Celery 监控面板（native worker 路径；Docker worker 由 Dockerfile 安装）
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "scripts"]  # app + scripts/validate_stage_evidence 可在测试中导入
python_files = ["test_*.py", "*_test.py", "e2e_*.py"]
addopts = "-m 'not integration and not live_eval' -p no:langsmith"
markers = [
    "integration: 真实外部 API(Ollama/DeepSeek)测试，默认跳过；-m integration 单独跑",
    "live_eval: C2 release smoke，调用真实 DeepSeek/Ollama，仅由安全执行器显式运行",
]

[tool.ruff]
line-length = 100
