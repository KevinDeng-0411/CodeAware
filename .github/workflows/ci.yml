name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests (run_tests_safe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeaware-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Cache uv deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('codeaware-py/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install deps (incl. dev pytest)
        run: uv sync --frozen

      - name: Build pg image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile.bm25
          tags: codeaware/pgvector-pgsearch:pg16-v0.12.0
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run full backend suite
        # Fail-closed disposable PG/Redis; fake embedder, all mocked, no LLM cost
        run: uv run python scripts/run_tests_safe.py -q

  frontend-test:
    name: Frontend tests + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeaware-py/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: codeaware-py/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npx oxlint

      - name: Run tests (vitest)
        run: npm test